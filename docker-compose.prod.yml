name: paint-with-me-prod

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paint
      POSTGRES_PASSWORD: paint
      POSTGRES_DB: paint_with_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paint -d paint_with_me"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:3001"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
